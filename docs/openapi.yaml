openapi: 3.1.0
info:
  title: ServiDesk API
  version: 0.9.0
  summary: Contratos HTTP de los 6 microservicios de ServiDesk (propuesta pendiente de aprobación).
  description: |
    Cada microservicio tiene su propia HTTP API en API Gateway, por eso cada ruta declara su `servers`.
    Todas las rutas, salvo `POST /auth/login`, requieren `Authorization: Bearer <JWT>`; el tenant y el schema
    salen del token validado por el Lambda Authorizer y nunca del body ni de la query.
    Documentación en prosa: docs/API_CONTRACTS.md.

tags:
  - name: identity
    description: Login, usuarios y equipos (ms-identity)
  - name: cmdb
    description: Elementos de configuración (ms-cmdb)
  - name: incidents
    description: Incidentes y comentarios (ms-incidents)
  - name: problems
    description: Problemas y errores conocidos (ms-problems)
  - name: changes
    description: Solicitudes de cambio y CAB (ms-changes)
  - name: requests
    description: Catálogo y solicitudes de servicio (ms-requests)

security:
  - bearerAuth: []

x-servers:
  identity: &srvIdentity
    - url: "{baseUrl}"
      description: VITE_API_IDENTITY_URL
      variables: { baseUrl: { default: https://identity.example.execute-api.us-east-1.amazonaws.com } }
  cmdb: &srvCmdb
    - url: "{baseUrl}"
      description: VITE_API_CMDB_URL
      variables: { baseUrl: { default: https://cmdb.example.execute-api.us-east-1.amazonaws.com } }
  incidents: &srvIncidents
    - url: "{baseUrl}"
      description: VITE_API_INCIDENTS_URL
      variables: { baseUrl: { default: https://incidents.example.execute-api.us-east-1.amazonaws.com } }
  problems: &srvProblems
    - url: "{baseUrl}"
      description: VITE_API_PROBLEMS_URL
      variables: { baseUrl: { default: https://problems.example.execute-api.us-east-1.amazonaws.com } }
  changes: &srvChanges
    - url: "{baseUrl}"
      description: VITE_API_CHANGES_URL
      variables: { baseUrl: { default: https://changes.example.execute-api.us-east-1.amazonaws.com } }
  requests: &srvRequests
    - url: "{baseUrl}"
      description: VITE_API_REQUESTS_URL
      variables: { baseUrl: { default: https://requests.example.execute-api.us-east-1.amazonaws.com } }

paths:
  # ======================= ms-identity =======================
  /auth/login:
    servers: *srvIdentity
    post:
      tags: [identity]
      operationId: login
      summary: Iniciar sesión (ID-01)
      x-status: B
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { tenant_code: andina, email: lucia.paredes@andina.pe, password: "Andina#2026" }
      responses:
        "200":
          description: Credenciales válidas
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/LoginResponse" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/me:
    servers: *srvIdentity
    get:
      tags: [identity]
      operationId: getMe
      summary: Usuario autenticado (ID-02)
      x-status: C
      x-roles: [admin, agent, customer]
      responses:
        "200": { $ref: "#/components/responses/AuthUserResponse" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users:
    servers: *srvIdentity
    get:
      tags: [identity]
      operationId: listUsers
      summary: Listar usuarios (ID-03)
      x-status: A-parcial
      x-roles: [admin, agent]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/sortOrder"
        - name: sort_by
          in: query
          schema: { type: string, enum: [created_at, full_name, email], default: created_at }
        - name: role
          in: query
          description: Uno o varios roles separados por comas
          schema: { type: string, example: "agent,admin" }
        - name: active
          in: query
          schema: { type: boolean }
        - name: ids
          in: query
          description: Hasta 100 UUID separados por comas
          schema: { type: string }
      responses:
        "200":
          description: Página de usuarios
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [identity]
      operationId: createUser
      summary: Crear usuario (ID-05)
      x-status: C
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
            example: { email: jorge.huaman@andina.pe, full_name: Jorge Huamán Ríos, role: customer, password: "Temporal#2026", active: true }
      responses:
        "201": { $ref: "#/components/responses/UserCreated" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{id}:
    servers: *srvIdentity
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [identity]
      operationId: getUser
      summary: Consultar usuario (ID-04)
      x-status: C
      x-roles: [admin, agent]
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [identity]
      operationId: updateUser
      summary: Actualizar usuario (ID-06)
      x-status: C
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
            example: { role: agent, active: false }
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /teams:
    servers: *srvIdentity
    get:
      tags: [identity]
      operationId: listTeams
      summary: Listar equipos (ID-07)
      x-status: C
      x-roles: [admin, agent]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/sortOrder"
        - name: sort_by
          in: query
          schema: { type: string, enum: [name], default: name }
      responses:
        "200":
          description: Página de equipos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ======================= ms-cmdb =======================
  /cis:
    servers: *srvCmdb
    get:
      tags: [cmdb]
      operationId: listCis
      summary: Listar elementos de configuración (CM-01)
      x-status: A-parcial
      x-roles: [admin, agent]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/sortOrder"
        - name: sort_by
          in: query
          schema: { type: string, enum: [created_at, updated_at, name, status], default: created_at }
        - name: status
          in: query
          description: Uno o varios de operational, degraded, down, retired (separados por comas)
          schema: { type: string }
        - name: environment
          in: query
          description: Uno o varios de prod, qa, dev
          schema: { type: string }
        - name: type_id
          in: query
          schema: { type: integer }
        - name: owner_team_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Página de CI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationItemPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [cmdb]
      operationId: createCi
      summary: Registrar elemento (CM-02)
      x-status: C
      x-roles: [admin, agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConfigurationItemRequest" }
      responses:
        "201": { $ref: "#/components/responses/CiCreated" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /cis/{id}:
    servers: *srvCmdb
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [cmdb]
      operationId: getCi
      summary: Consultar elemento (CM-03)
      x-status: C
      x-roles: [admin, agent]
      responses:
        "200": { $ref: "#/components/responses/CiResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [cmdb]
      operationId: updateCi
      summary: Actualizar elemento (CM-04)
      x-status: C
      x-roles: [admin, agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConfigurationItemRequest" }
      responses:
        "200": { $ref: "#/components/responses/CiResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [cmdb]
      operationId: deleteCi
      summary: Eliminar elemento, baja lógica a retired (CM-06)
      x-status: C
      x-roles: [admin]
      responses:
        "204": { description: CI retirado }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /cis/{id}/status:
    servers: *srvCmdb
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [cmdb]
      operationId: updateCiStatus
      summary: Cambiar estado del elemento (CM-05)
      x-status: C
      x-roles: [admin, agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConfigurationItemStatusRequest" }
            example: { status: down }
      responses:
        "200": { $ref: "#/components/responses/CiResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /cis/{id}/relations:
    servers: *srvCmdb
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [cmdb]
      operationId: listCiRelations
      summary: Relaciones del elemento (CM-07)
      x-status: C
      x-roles: [admin, agent]
      responses:
        "200":
          description: Relaciones entrantes y salientes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CIRelationView" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /ci-types:
    servers: *srvCmdb
    get:
      tags: [cmdb]
      operationId: listCiTypes
      summary: Tipos de CI (CM-08)
      x-status: C
      x-roles: [admin, agent]
      responses:
        "200":
          description: Lista completa (sin paginar)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CIType" } }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ======================= ms-incidents =======================
  /incidents:
    servers: *srvIncidents
    get:
      tags: [incidents]
      operationId: listIncidents
      summary: Listar incidentes (IN-01)
      x-status: A
      x-roles: [admin, agent, customer]
      description: Para customer el backend filtra por reporter_id = sub.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/sortOrder"
        - name: sort_by
          in: query
          schema: { type: string, enum: [created_at, priority, sla_due_at, status, key], default: created_at }
        - name: status
          in: query
          description: Uno o varios de new, in_progress, on_hold, resolved, closed
          schema: { type: string, example: "new,in_progress" }
        - name: priority
          in: query
          description: Uno o varios de P1, P2, P3, P4
          schema: { type: string }
        - name: impact
          in: query
          schema: { type: string }
        - name: urgency
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/assigneeFilter"
        - name: team_id
          in: query
          schema: { type: string, format: uuid }
        - name: ci_id
          in: query
          schema: { type: string, format: uuid }
        - name: problem_id
          in: query
          schema: { type: string, format: uuid }
        - name: channel
          in: query
          schema: { $ref: "#/components/schemas/IncidentChannel" }
        - name: sla_breached
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Página de incidentes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [incidents]
      operationId: createIncident
      summary: Crear incidente (IN-02)
      x-status: B
      x-roles: [admin, agent, customer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIncidentRequest" }
            example:
              title: No carga el sistema de historias clínicas
              description: Desde las 8:10 la aplicación muestra error 502 en todas las sedes.
              impact: high
              urgency: high
              ci_id: 8c2d4e6f-1a3b-4c5d-8e7f-9a0b1c2d3e4f
      responses:
        "201": { $ref: "#/components/responses/IncidentCreated" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /incidents/{id}:
    servers: *srvIncidents
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [incidents]
      operationId: getIncident
      summary: Consultar incidente (IN-03)
      x-status: C
      x-roles: [admin, agent, customer]
      responses:
        "200": { $ref: "#/components/responses/IncidentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [incidents]
      operationId: updateIncident
      summary: Actualizar incidente (IN-04)
      x-status: C
      x-roles: [admin, agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIncidentRequest" }
      responses:
        "200": { $ref: "#/components/responses/IncidentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /incidents/{id}/status:
    servers: *srvIncidents
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [incidents]
      operationId: updateIncidentStatus
      summary: Cambiar estado del incidente (IN-05)
      x-status: C
      x-roles: [admin, agent, customer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIncidentStatusRequest" }
            example: { status: resolved, comment: Se reinició el pool de conexiones del balanceador. }
      responses:
        "200": { $ref: "#/components/responses/IncidentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /incidents/{id}/comments:
    servers: *srvIncidents
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [incidents]
      operationId: listIncidentComments
      summary: Listar comentarios (IN-06)
      x-status: C
      x-roles: [admin, agent, customer]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: sort_by
          in: query
          schema: { type: string, enum: [created_at], default: created_at }
        - name: sort_order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: Página de comentarios
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentCommentPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [incidents]
      operationId: createIncidentComment
      summary: Agregar comentario (IN-07)
      x-status: C
      x-roles: [admin, agent, customer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIncidentCommentRequest" }
            example: { body: Adjunto captura del error en la sede San Isidro., internal: false }
      responses:
        "201":
          description: Comentario creado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/IncidentComment" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ======================= ms-problems =======================
  /problems:
    servers: *srvProblems
    get:
      tags: [problems]
      operationId: listProblems
      summary: Listar problemas (PR-01)
      x-status: A-parcial
      x-roles: [admin, agent]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/sortOrder"
        - name: sort_by
          in: query
          schema: { type: string, enum: [created_at, priority, status, key], default: created_at }
        - name: status
          in: query
          description: Uno o varios de new, investigating, known_error, resolved, closed
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string }
        - name: ci_id
          in: query
          schema: { type: string, format: uuid }
        - name: owner_id
          in: query
          description: '"me" o un UUID'
          schema: { type: string }
      responses:
        "200":
          description: Página de problemas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [problems]
      operationId: createProblem
      summary: Crear problema (PR-02)
      x-status: C
      x-roles: [admin, agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProblemRequest" }
      responses:
