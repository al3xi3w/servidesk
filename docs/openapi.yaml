        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT HS256 emitido por POST /auth/login. Claims: sub, tenant_id, schema, role, iat, exp.'

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    search:
      name: search
      in: query
      schema: { type: string, minLength: 2, maxLength: 100 }
    sortOrder:
      name: sort_order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
    assigneeFilter:
      name: assignee_id
      in: query
      description: '"me" (usuario del token), "none" (sin asignar) o un UUID'
      schema: { type: string }

  responses:
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: VALIDATION_ERROR
              message: La solicitud tiene campos inválidos
              details: [{ field: title, issue: Debe tener entre 3 y 200 caracteres }]
              request_id: c0a8e3f4-1b2d-4e5f-9a6b-7c8d9e0f1a2b
    InvalidCredentials:
      description: Tenant, email o contraseña incorrectos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { error: { code: INVALID_CREDENTIALS, message: Credenciales inválidas } }
    GatewayUnauthorized:
      description: Falta el header Authorization (respuesta de API Gateway, sin invocar al authorizer)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GatewayError" }
          example: { message: Unauthorized }
    Forbidden:
      description: |
        Dos orígenes posibles: API Gateway responde {"message":"Forbidden"} cuando el token es inválido o venció;
        el microservicio responde {"error":{"code":"FORBIDDEN"}} cuando el rol no tiene permiso.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/GatewayError"
              - $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: No existe en el schema del tenant (o, para customer, no es suyo)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { error: { code: NOT_FOUND, message: Recurso no encontrado } }
    Conflict:
      description: Transición de estado no permitida, recurso no editable o duplicado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: INVALID_STATUS_TRANSITION
              message: Transición de estado no permitida
              details: [{ field: status, issue: "De 'closed' no se puede pasar a 'in_progress'" }]
    InternalError:
      description: Error no controlado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { error: { code: INTERNAL_ERROR, message: Error interno, request_id: c0a8e3f4-1b2d-4e5f-9a6b-7c8d9e0f1a2b } }

    AuthUserResponse:
      description: Usuario autenticado
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/AuthUser" } }
    UserResponse:
      description: Usuario
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/User" } }
    UserCreated:
      description: Usuario creado
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/User" } }
    CiResponse:
      description: Elemento de configuración
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/ConfigurationItem" } }
    CiCreated:
      description: Elemento creado
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/ConfigurationItem" } }
    IncidentResponse:
      description: Incidente
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/Incident" } }
    IncidentCreated:
      description: Incidente creado
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/Incident" } }
    ProblemResponse:
      description: Problema con incidentes vinculados y error conocido
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/ProblemDetail" } }
    ProblemCreated:
      description: Problema creado o error conocido publicado
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/ProblemDetail" } }
    ChangeResponse:
      description: Cambio con CI afectados y aprobaciones
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/ChangeDetail" } }
    ChangeCreated:
      description: Cambio creado en estado draft
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/ChangeDetail" } }
    ServiceRequestResponse:
      description: Solicitud con aprobaciones
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/ServiceRequestDetail" } }
    ServiceRequestCreated:
      description: Solicitud creada
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: "#/components/schemas/ServiceRequestDetail" } }

  schemas:
    # ---------- Comunes ----------
    UUID: { type: string, format: uuid }
    NullableUUID: { type: [string, "null"], format: uuid }
    DateTime: { type: string, format: date-time, description: 'ISO 8601 UTC, p. ej. 2026-11-05T19:20:25Z' }
    NullableDateTime: { type: [string, "null"], format: date-time }
    Role: { type: string, enum: [admin, agent, customer] }
    Priority: { type: string, enum: [P1, P2, P3, P4] }
    Level: { type: string, enum: [high, medium, low], description: Valores propuestos en D6 }

    PaginationMeta:
      type: object
      required: [page, limit, total, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }

    FieldError:
      type: object
      required: [field, issue]
      properties:
        field: { type: string }
        issue: { type: string }

    ErrorCode:
      type: string
      enum: [VALIDATION_ERROR, INVALID_CREDENTIALS, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT,
             EMAIL_ALREADY_EXISTS, INVALID_STATUS_TRANSITION, NOT_IMPLEMENTED, INTERNAL_ERROR]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details: { type: array, items: { $ref: "#/components/schemas/FieldError" } }
            request_id: { type: string }

    GatewayError:
      type: object
      required: [message]
      properties:
        message: { type: string, enum: [Unauthorized, Forbidden] }

    JwtPayload:
      type: object
      required: [sub, tenant_id, schema, role, iat, exp]
      properties:
        sub: { $ref: "#/components/schemas/UUID" }
        tenant_id: { type: string, pattern: "^[a-z0-9_]+$", example: andina }
        schema: { type: string, pattern: "^tenant_[a-z0-9_]+$", example: tenant_andina }
        role: { $ref: "#/components/schemas/Role" }
        iat: { type: integer }
        exp: { type: integer }

    # ---------- Identity ----------
    LoginRequest:
      type: object
      additionalProperties: false
      required: [tenant_code, email, password]
      properties:
        tenant_code: { type: string, pattern: "^[a-z0-9_]{2,30}$" }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }

    TenantSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: andina }
        name: { type: string, example: Andina Retail }

    User:
      type: object
      required: [id, email, full_name, role, active, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        created_at: { $ref: "#/components/schemas/DateTime" }

    AuthUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [tenant]
          properties:
            tenant: { $ref: "#/components/schemas/TenantSummary" }

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, example: 3600 }
        user: { $ref: "#/components/schemas/AuthUser" }

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, full_name, role, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        full_name: { type: string, minLength: 3, maxLength: 150 }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, minLength: 8, maxLength: 128 }
        active: { type: boolean, default: true }

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        full_name: { type: string, minLength: 3, maxLength: 150 }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        password: { type: string, minLength: 8, maxLength: 128 }

    Team:
      type: object
      required: [id, name, description]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        description: { type: [string, "null"] }

    UserPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/User" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    TeamPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Team" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- CMDB ----------
    CIStatus: { type: string, enum: [operational, degraded, down, retired] }
    CIEnvironment: { type: string, enum: [prod, qa, dev] }
    CIRelationType: { type: string, enum: [depends_on, runs_on, connects_to] }

    CIType:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    ConfigurationItem:
      type: object
      required: [id, type_id, type_name, name, status, environment, version, owner_team_id, attributes, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        type_id: { type: integer }
        type_name: { type: string, description: Derivado (JOIN ci_types) }
        name: { type: string }
        status: { $ref: "#/components/schemas/CIStatus" }
        environment: { $ref: "#/components/schemas/CIEnvironment" }
        version: { type: [string, "null"] }
        owner_team_id: { $ref: "#/components/schemas/NullableUUID" }
        attributes: { type: object, additionalProperties: true }
        created_at: { $ref: "#/components/schemas/DateTime", description: Columna pendiente de agregar al ER (D9) }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    CreateConfigurationItemRequest:
      type: object
      additionalProperties: false
      required: [type_id, name, environment]
      properties:
        type_id: { type: integer }
        name: { type: string, minLength: 2, maxLength: 150 }
        environment: { $ref: "#/components/schemas/CIEnvironment" }
        version: { type: [string, "null"], maxLength: 50 }
        owner_team_id: { $ref: "#/components/schemas/NullableUUID" }
        attributes: { type: object, additionalProperties: true }

    UpdateConfigurationItemRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        type_id: { type: integer }
        name: { type: string, minLength: 2, maxLength: 150 }
        environment: { $ref: "#/components/schemas/CIEnvironment" }
        version: { type: [string, "null"], maxLength: 50 }
        owner_team_id: { $ref: "#/components/schemas/NullableUUID" }
        attributes: { type: object, additionalProperties: true }

    UpdateConfigurationItemStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/CIStatus" }

    CIRelationView:
      type: object
      required: [id, relation, direction, ci]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        relation: { $ref: "#/components/schemas/CIRelationType" }
        direction: { type: string, enum: [outgoing, incoming] }
        ci:
          type: object
          required: [id, name, status, type_name]
          properties:
            id: { $ref: "#/components/schemas/UUID" }
            name: { type: string }
            status: { $ref: "#/components/schemas/CIStatus" }
            type_name: { type: string }

    ConfigurationItemPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ConfigurationItem" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Incidents ----------
    IncidentStatus: { type: string, enum: [new, in_progress, on_hold, resolved, closed] }
    IncidentChannel: { type: string, enum: [portal, email, auto] }

    Incident:
      type: object
      required: [id, key, title, description, status, impact, urgency, priority, sla_policy_id, sla_due_at,
                 sla_breached, reporter_id, assignee_id, team_id, ci_id, problem_id, channel, created_at, resolved_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        key: { type: string, example: INC-004512 }
        title: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        impact: { $ref: "#/components/schemas/Level" }
        urgency: { $ref: "#/components/schemas/Level" }
        priority: { $ref: "#/components/schemas/Priority" }
        sla_policy_id: { type: [integer, "null"] }
        sla_due_at: { $ref: "#/components/schemas/NullableDateTime" }
        sla_breached: { type: boolean }
        reporter_id: { $ref: "#/components/schemas/UUID" }
        assignee_id: { $ref: "#/components/schemas/NullableUUID" }
        team_id: { $ref: "#/components/schemas/NullableUUID" }
        ci_id: { $ref: "#/components/schemas/NullableUUID" }
        problem_id: { $ref: "#/components/schemas/NullableUUID" }
        channel: { $ref: "#/components/schemas/IncidentChannel" }
        created_at: { $ref: "#/components/schemas/DateTime" }
        resolved_at: { $ref: "#/components/schemas/NullableDateTime" }

    CreateIncidentRequest:
      type: object
      additionalProperties: false
      required: [title, impact, urgency]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 5000 }
        impact: { $ref: "#/components/schemas/Level" }
        urgency: { $ref: "#/components/schemas/Level" }
        ci_id: { $ref: "#/components/schemas/NullableUUID" }
        team_id: { $ref: "#/components/schemas/NullableUUID", description: Solo agent y admin }
        assignee_id: { $ref: "#/components/schemas/NullableUUID", description: Solo agent y admin }

    UpdateIncidentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 5000 }
        impact: { $ref: "#/components/schemas/Level" }
        urgency: { $ref: "#/components/schemas/Level" }
        ci_id: { $ref: "#/components/schemas/NullableUUID" }
        team_id: { $ref: "#/components/schemas/NullableUUID" }
        assignee_id: { $ref: "#/components/schemas/NullableUUID" }
        problem_id: { $ref: "#/components/schemas/NullableUUID" }

    UpdateIncidentStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/IncidentStatus" }
        comment: { type: string, minLength: 1, maxLength: 5000, description: Obligatorio al pasar a resolved }

    IncidentComment:
      type: object
      required: [id, incident_id, author_id, body, internal, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        incident_id: { $ref: "#/components/schemas/UUID" }
        author_id: { $ref: "#/components/schemas/UUID" }
        body: { type: string }
        internal: { type: boolean }
        created_at: { $ref: "#/components/schemas/DateTime" }

    CreateIncidentCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
        internal: { type: boolean, default: false }

    IncidentPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Incident" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    IncidentCommentPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/IncidentComment" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Problems ----------
    ProblemStatus: { type: string, enum: [new, investigating, known_error, resolved, closed] }

    Problem:
      type: object
      required: [id, key, title, description, status, priority, root_cause, ci_id, owner_id, fix_change_id, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        key: { type: string, example: PRB-000045 }
        title: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ProblemStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        root_cause: { type: [string, "null"] }
        ci_id: { $ref: "#/components/schemas/NullableUUID" }
        owner_id: { $ref: "#/components/schemas/NullableUUID" }
        fix_change_id: { $ref: "#/components/schemas/NullableUUID" }
        created_at: { $ref: "#/components/schemas/DateTime" }

    KnownError:
      type: object
      required: [id, problem_id, symptom, workaround, published_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        problem_id: { $ref: "#/components/schemas/UUID" }
        symptom: { type: string }
        workaround: { type: string }
        published_at: { $ref: "#/components/schemas/DateTime" }

    ProblemDetail:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [incident_ids, known_error]
          properties:
            incident_ids: { type: array, items: { $ref: "#/components/schemas/UUID" } }
            known_error:
              oneOf:
                - $ref: "#/components/schemas/KnownError"
                - type: "null"

    CreateProblemRequest:
      type: object
      additionalProperties: false
      required: [title, priority]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 5000 }
        priority: { $ref: "#/components/schemas/Priority" }
        ci_id: { $ref: "#/components/schemas/NullableUUID" }
        owner_id: { $ref: "#/components/schemas/NullableUUID" }
        incident_ids: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/UUID" } }

    UpdateProblemRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 5000 }
        priority: { $ref: "#/components/schemas/Priority" }
        root_cause: { type: [string, "null"], maxLength: 5000 }
        ci_id: { $ref: "#/components/schemas/NullableUUID" }
        owner_id: { $ref: "#/components/schemas/NullableUUID" }
        fix_change_id: { $ref: "#/components/schemas/NullableUUID" }

    UpdateProblemStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [investigating, resolved, closed] }

    PublishKnownErrorRequest:
      type: object
      additionalProperties: false
      required: [symptom, workaround]
      properties:
        symptom: { type: string, minLength: 3, maxLength: 5000 }
        workaround: { type: string, minLength: 3, maxLength: 5000 }

    LinkIncidentsRequest:
      type: object
      additionalProperties: false
      required: [incident_ids]
      properties:
        incident_ids: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/UUID" } }

    ProblemPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Problem" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Changes ----------
    ChangeType: { type: string, enum: [standard, normal, emergency] }
    ChangeRisk: { type: string, enum: [low, medium, high] }
    ChangeStatus: { type: string, enum: [draft, submitted, approved, rejected, scheduled, implemented, failed] }
    ApprovalDecision: { type: string, enum: [pending, approved, rejected] }

    Change:
      type: object
      required: [id, key, title, description, type, risk, status, rollback_plan, planned_start, planned_end,
                 requester_id, problem_id, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        key: { type: string, example: CHG-000210 }
        title: { type: string }
        description: { type: [string, "null"] }
        type: { $ref: "#/components/schemas/ChangeType" }
        risk: { $ref: "#/components/schemas/ChangeRisk" }
        status: { $ref: "#/components/schemas/ChangeStatus" }
        rollback_plan: { type: [string, "null"] }
        planned_start: { $ref: "#/components/schemas/NullableDateTime" }
        planned_end: { $ref: "#/components/schemas/NullableDateTime" }
        requester_id: { $ref: "#/components/schemas/UUID" }
        problem_id: { $ref: "#/components/schemas/NullableUUID" }
        created_at: { $ref: "#/components/schemas/DateTime" }

    ChangeCI:
      type: object
      additionalProperties: false
      required: [ci_id]
      properties:
        ci_id: { $ref: "#/components/schemas/UUID" }
        new_version: { type: [string, "null"], maxLength: 50 }

    ChangeApproval:
      type: object
      required: [id, change_id, approver_id, decision, comment, decided_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        change_id: { $ref: "#/components/schemas/UUID" }
        approver_id: { $ref: "#/components/schemas/UUID" }
        decision: { $ref: "#/components/schemas/ApprovalDecision" }
        comment: { type: [string, "null"] }
        decided_at: { $ref: "#/components/schemas/NullableDateTime" }

    ChangeDetail:
      allOf:
        - $ref: "#/components/schemas/Change"
        - type: object
          required: [cis, approvals]
          properties:
            cis: { type: array, items: { $ref: "#/components/schemas/ChangeCI" } }
            approvals: { type: array, items: { $ref: "#/components/schemas/ChangeApproval" } }

    CreateChangeRequest:
      type: object
      additionalProperties: false
      required: [title, type, risk]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 5000 }
        type: { $ref: "#/components/schemas/ChangeType" }
        risk: { $ref: "#/components/schemas/ChangeRisk" }
        rollback_plan: { type: [string, "null"], maxLength: 5000 }
        planned_start: { $ref: "#/components/schemas/NullableDateTime" }
        planned_end: { $ref: "#/components/schemas/NullableDateTime" }
        problem_id: { $ref: "#/components/schemas/NullableUUID" }
        cis: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ChangeCI" } }

    UpdateChangeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 5000 }
        type: { $ref: "#/components/schemas/ChangeType" }
        risk: { $ref: "#/components/schemas/ChangeRisk" }
        rollback_plan: { type: [string, "null"], maxLength: 5000 }
        planned_start: { $ref: "#/components/schemas/NullableDateTime" }
        planned_end: { $ref: "#/components/schemas/NullableDateTime" }
        problem_id: { $ref: "#/components/schemas/NullableUUID" }
        cis: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ChangeCI" } }

    UpdateChangeStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [draft, submitted, scheduled, implemented, failed] }

    ApproveChangeRequest:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, maxLength: 2000 }

    RejectChangeRequest:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment: { type: string, minLength: 3, maxLength: 2000 }

    ChangePage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Change" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Requests ----------
    ServiceRequestStatus: { type: string, enum: [submitted, pending_approval, approved, in_fulfillment, fulfilled, rejected] }

    CatalogFormField:
      type: object
      required: [name, label, type, required]
      properties:
        name: { type: string, pattern: "^[a-z0-9_]+$" }
        label: { type: string }
        type: { type: string, enum: [text, textarea, number, date, select, boolean] }
        required: { type: boolean }
        options: { type: array, items: { type: string }, description: Solo para type = select }

    CatalogItem:
      type: object
      required: [id, category_id, category_name, name, form_schema, needs_approval, sla_hours]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        category_id: { type: integer }
        category_name: { type: string, description: Derivado (JOIN catalog_categories) }
        name: { type: string }
        form_schema:
          type: object
          required: [fields]
          properties:
            fields: { type: array, items: { $ref: "#/components/schemas/CatalogFormField" } }
        needs_approval: { type: boolean }
        sla_hours: { type: [integer, "null"] }

    RequestApproval:
      type: object
      required: [id, request_id, approver_id, decision, decided_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        request_id: { $ref: "#/components/schemas/UUID" }
        approver_id: { $ref: "#/components/schemas/UUID" }
        decision: { $ref: "#/components/schemas/ApprovalDecision" }
        decided_at: { $ref: "#/components/schemas/NullableDateTime" }

    ServiceRequest:
      type: object
      required: [id, key, catalog_item_id, catalog_item_name, form_data, status, requester_id, assignee_id,
                 created_at, fulfilled_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        key: { type: string, example: REQ-000987 }
        catalog_item_id: { $ref: "#/components/schemas/UUID" }
        catalog_item_name: { type: string, description: Derivado (JOIN catalog_items) }
        form_data: { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/ServiceRequestStatus" }
        requester_id: { $ref: "#/components/schemas/UUID" }
        assignee_id: { $ref: "#/components/schemas/NullableUUID" }
        created_at: { $ref: "#/components/schemas/DateTime" }
        fulfilled_at: { $ref: "#/components/schemas/NullableDateTime" }

    ServiceRequestDetail:
      allOf:
        - $ref: "#/components/schemas/ServiceRequest"
        - type: object
          required: [approvals]
          properties:
            approvals: { type: array, items: { $ref: "#/components/schemas/RequestApproval" } }

    CreateServiceRequestRequest:
      type: object
      additionalProperties: false
      required: [catalog_item_id, form_data]
      properties:
        catalog_item_id: { $ref: "#/components/schemas/UUID" }
        form_data: { type: object, additionalProperties: true }

    UpdateServiceRequestRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        assignee_id: { $ref: "#/components/schemas/NullableUUID", description: Solo agent y admin }
        form_data: { type: object, additionalProperties: true, description: 'Solo el solicitante, antes de atenderse' }

    UpdateServiceRequestStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [approved, rejected, in_fulfillment, fulfilled] }

    ServiceRequestPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ServiceRequest" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
