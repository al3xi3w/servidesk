# Identidad: login/JWT, usuarios, equipos, notificaciones (consumidor identity-notify-q)
service: servidesk-identity
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 1024          # PBKDF2 (310 000 iteraciones) en el login necesita CPU
  timeout: 15
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${param:commonLayerArn}
  environment:
    DB_HOST: ${param:dbHost}
    DB_NAME: db_identity
    DB_USER: servidesk_admin
    DB_PASSWORD: ${env:DB_PASSWORD}
    EVENTS_TOPIC_ARN: ${param:eventsTopicArn}
    SERVICE_NAME: ms-identity
    JWT_SECRET: ${env:JWT_SECRET}
  httpApi:
    cors: true
    authorizers:
      jwtAuthorizer:
        type: request
        functionArn: ${param:authorizerArn}
        identitySource: $request.header.Authorization
        enableSimpleResponses: true
        payloadVersion: "2.0"
        resultTtlInSeconds: 300

package:
  patterns:
    - "!**"
    - "handlers/**"
    - "migrations/**"

functions:
  # ID-01 (pública)
  login:
    handler: handlers/login.login
    events:
      - httpApi: { method: POST, path: /auth/login }
  # ID-02
  me:
    handler: handlers/login.me
    events:
      - httpApi: { method: GET, path: /auth/me, authorizer: { name: jwtAuthorizer } }
  # ID-03
  listUsers:
    handler: handlers/users.listUsers
    events:
      - httpApi: { method: GET, path: /users, authorizer: { name: jwtAuthorizer } }
  # ID-04
  getUser:
    handler: handlers/users.getUser
    events:
      - httpApi: { method: GET, path: "/users/{id}", authorizer: { name: jwtAuthorizer } }
  # ID-05
  createUser:
    handler: handlers/users.createUser
    events:
      - httpApi: { method: POST, path: /users, authorizer: { name: jwtAuthorizer } }
  # ID-06
  updateUser:
    handler: handlers/users.updateUser
    events:
      - httpApi: { method: PATCH, path: "/users/{id}", authorizer: { name: jwtAuthorizer } }
  # ID-07
  listTeams:
    handler: handlers/users.listTeams
    events:
      - httpApi: { method: GET, path: /teams, authorizer: { name: jwtAuthorizer } }
  # Bandeja de notificaciones (campana del frontend)
  listNotifications:
    handler: handlers/notifications.listNotifications
    events:
      - httpApi: { method: GET, path: /notifications, authorizer: { name: jwtAuthorizer } }
  markNotificationsRead:
    handler: handlers/notifications.markNotificationsRead
    events:
      - httpApi: { method: POST, path: /notifications/read, authorizer: { name: jwtAuthorizer } }

  migrate:
    handler: handlers/migrate.handle   # se invoca a mano tras el deploy
    timeout: 300

  # Consumidor SQS: eventos de los demás servicios -> notificaciones
  onNotifyEvent:
    handler: handlers/consumers.on_notify_event
    timeout: 30
    events:
      - sqs:
          arn: !GetAtt NotifyQueue.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

resources:
  Resources:
    # El authorizer vive en el stack infra: API Gateway necesita permiso para invocarlo
    AuthorizerInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: ${param:authorizerArn}
        Principal: apigateway.amazonaws.com
        SourceArn: !Join ["", ["arn:aws:execute-api:", !Ref AWS::Region, ":", !Ref AWS::AccountId, ":", !Ref HttpApi, "/*"]]

    # ---- identity-notify-q: SNS (eventos de todos los servicios) -> SQS -> onNotifyEvent ----
    NotifyDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: servidesk-identity-notify-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600
    NotifyQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: servidesk-identity-notify-q-${sls:stage}
        VisibilityTimeout: 180          # >= 6 x timeout del consumidor
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt NotifyDLQ.Arn
          maxReceiveCount: 3
    NotifyQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref NotifyQueue]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt NotifyQueue.Arn
              Condition:
                ArnEquals: { aws:SourceArn: "${param:eventsTopicArn}" }
    NotifySubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${param:eventsTopicArn}
        Protocol: sqs
        Endpoint: !GetAtt NotifyQueue.Arn
        RawMessageDelivery: true
        FilterPolicy:
          eventType:
            - IncidentCreated
            - IncidentUpdated
            - IncidentResolved
            - ProblemCreated
            - KnownErrorPublished
            - ChangeSubmitted
            - ChangeApproved
            - ChangeRejected
            - RequestSubmitted
            - RequestApproved
            - RequestRejected
            - RequestFulfilled
