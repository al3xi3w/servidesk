# Incidentes: colas, SLA, comentarios, adjuntos
# Responsable: Ian
service: servidesk-incidents
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${param:commonLayerArn}
  environment:
    DB_HOST: ${param:dbHost}
    DB_NAME: db_incidents
    DB_USER: servidesk_admin
    DB_PASSWORD: ${env:DB_PASSWORD}
    EVENTS_TOPIC_ARN: ${param:eventsTopicArn}
    SERVICE_NAME: ms-incidents
    ATTACHMENTS_BUCKET: ${param:attachmentsBucket}
    EXPORTS_BUCKET: ${param:exportsBucket}
  httpApi:
    cors: true
    authorizers:
      jwtAuthorizer:
        type: request
        functionArn: ${param:authorizerArn}
        identitySource: $request.header.Authorization
        enableSimpleResponses: true
        payloadVersion: "2.0"
        resultTtlInSeconds: 300

package:
  patterns:
    - "!**"
    - "handlers/**"
    - "migrations/**"

functions:
  listIncidents:
    handler: handlers/incidents.listIncidents
    events:
      - httpApi:
          method: GET
          path: /incidents
          authorizer:
            name: jwtAuthorizer
  createIncident:
    handler: handlers/incidents.createIncident
    events:
      - httpApi:
          method: POST
          path: /incidents
          authorizer:
            name: jwtAuthorizer
  migrate:
    handler: handlers/migrate.handle   # se invoca a mano tras el deploy
    timeout: 300
  onCiStatusChanged:
    handler: handlers/consumers.on_ci_status_changed
    events:
      - sqs:
          arn: !GetAtt CiStatusQueue.Arn
          batchSize: 10

resources:
  Resources:
    # El authorizer vive en el stack infra: API Gateway necesita permiso para invocarlo
    AuthorizerInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: ${param:authorizerArn}
        Principal: apigateway.amazonaws.com
        SourceArn: !Join ["", ["arn:aws:execute-api:", !Ref AWS::Region, ":", !Ref AWS::AccountId, ":", !Ref HttpApi, "/*"]]

    # ---- Ejemplo de consumidor: CMDB publica CIStatusChanged -> esta cola ----
    CiStatusDLQ:
      Type: AWS::SQS::Queue
    CiStatusQueue:
      Type: AWS::SQS::Queue
      Properties:
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt CiStatusDLQ.Arn
          maxReceiveCount: 3
    CiStatusQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref CiStatusQueue]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt CiStatusQueue.Arn
              Condition:
                ArnEquals: { aws:SourceArn: "${param:eventsTopicArn}" }
    CiStatusSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${param:eventsTopicArn}
        Protocol: sqs
        Endpoint: !GetAtt CiStatusQueue.Arn
        RawMessageDelivery: true
        FilterPolicy:
          eventType: [CIStatusChanged]
