# Problemas y errores conocidos (KEDB)
# Consume: problems-incidents-q (IncidentCreated), problems-changes-q (ChangeImplemented)
service: servidesk-problems
frameworkVersion: "3"
configValidationMode: warn   # el esquema de Serverless v3 no lista python3.12 (AWS sí lo soporta)

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  timeout: 15
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${param:commonLayerArn}
  environment:
    DB_HOST: ${param:dbHost}
    DB_NAME: db_problems
    DB_USER: servidesk_admin
    DB_PASSWORD: ${env:DB_PASSWORD}
    EVENTS_TOPIC_ARN: ${param:eventsTopicArn}
    SERVICE_NAME: ms-problems
  httpApi:
    cors: true
    authorizers:
      jwtAuthorizer:
        type: request
        functionArn: ${param:authorizerArn}
        identitySource: $request.header.Authorization
        enableSimpleResponses: true
        payloadVersion: "2.0"
        resultTtlInSeconds: 300

package:
  patterns:
    - "!**"
    - "handlers/**"
    - "migrations/**"
    - "!**/__pycache__/**"

functions:
  # PR-01
  listProblems:
    handler: handlers/problems.listProblems
    events:
      - httpApi: { method: GET, path: /problems, authorizer: { name: jwtAuthorizer } }
  # PR-02
  createProblem:
    handler: handlers/problems.createProblem
    events:
      - httpApi: { method: POST, path: /problems, authorizer: { name: jwtAuthorizer } }
  # PR-03
  getProblem:
    handler: handlers/problems.getProblem
    events:
      - httpApi: { method: GET, path: "/problems/{id}", authorizer: { name: jwtAuthorizer } }
  # PR-04
  updateProblem:
    handler: handlers/problems.updateProblem
    events:
      - httpApi: { method: PATCH, path: "/problems/{id}", authorizer: { name: jwtAuthorizer } }
  # PR-05
  changeProblemStatus:
    handler: handlers/problems.changeProblemStatus
    events:
      - httpApi: { method: PUT, path: "/problems/{id}/status", authorizer: { name: jwtAuthorizer } }
  # PR-06
  publishKnownError:
    handler: handlers/problems.publishKnownError
    events:
      - httpApi: { method: POST, path: "/problems/{id}/known-error", authorizer: { name: jwtAuthorizer } }
  # PR-07
  linkProblemIncidents:
    handler: handlers/problems.linkProblemIncidents
    events:
      - httpApi: { method: POST, path: "/problems/{id}/incidents", authorizer: { name: jwtAuthorizer } }

  migrate:
    handler: handlers/migrate.handle   # se invoca a mano tras el deploy
    timeout: 300

  # ---- Consumidores SQS ----
  onIncidentCreated:
    handler: handlers/consumers.on_incident_created
    timeout: 30
    events:
      - sqs: { arn: !GetAtt IncidentsQueue.Arn, batchSize: 10, functionResponseType: ReportBatchItemFailures }
  onChangeImplemented:
    handler: handlers/consumers.on_change_implemented
    timeout: 30
    events:
      - sqs: { arn: !GetAtt ChangesQueue.Arn, batchSize: 10, functionResponseType: ReportBatchItemFailures }

resources:
  Resources:
    # El authorizer vive en el stack infra: API Gateway necesita permiso para invocarlo
    AuthorizerInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: ${param:authorizerArn}
        Principal: apigateway.amazonaws.com
        SourceArn: !Join ["", ["arn:aws:execute-api:", !Ref AWS::Region, ":", !Ref AWS::AccountId, ":", !Ref HttpApi, "/*"]]

    # ---- problems-incidents-q: IncidentCreated -> detección de fallas recurrentes ----
    IncidentsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: servidesk-problems-incidents-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600
    IncidentsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: servidesk-problems-incidents-q-${sls:stage}
        VisibilityTimeout: 180
        RedrivePolicy: { deadLetterTargetArn: !GetAtt IncidentsDLQ.Arn, maxReceiveCount: 3 }
    IncidentsQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref IncidentsQueue]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt IncidentsQueue.Arn
              Condition: { ArnEquals: { aws:SourceArn: "${param:eventsTopicArn}" } }
    IncidentsSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${param:eventsTopicArn}
        Protocol: sqs
        Endpoint: !GetAtt IncidentsQueue.Arn
        RawMessageDelivery: true
        FilterPolicy: { eventType: [IncidentCreated] }

    # ---- problems-changes-q: ChangeImplemented -> cierra el problema corregido ----
    ChangesDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: servidesk-problems-changes-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600
    ChangesQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: servidesk-problems-changes-q-${sls:stage}
        VisibilityTimeout: 180
        RedrivePolicy: { deadLetterTargetArn: !GetAtt ChangesDLQ.Arn, maxReceiveCount: 3 }
    ChangesQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref ChangesQueue]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt ChangesQueue.Arn
              Condition: { ArnEquals: { aws:SourceArn: "${param:eventsTopicArn}" } }
    ChangesSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${param:eventsTopicArn}
        Protocol: sqs
        Endpoint: !GetAtt ChangesQueue.Arn
        RawMessageDelivery: true
        FilterPolicy: { eventType: [ChangeImplemented] }
