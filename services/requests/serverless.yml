# Solicitudes de servicio y catálogo
# Responsable: Daniel
service: servidesk-requests
frameworkVersion: "3"
configValidationMode: warn   # el esquema de Serverless v3 no lista python3.12 (AWS sí lo soporta)

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  timeout: 15
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${param:commonLayerArn}
  environment:
    DB_HOST: ${param:dbHost}
    DB_NAME: db_requests
    DB_USER: servidesk_admin
    DB_PASSWORD: ${env:DB_PASSWORD}
    EVENTS_TOPIC_ARN: ${param:eventsTopicArn}
    SERVICE_NAME: ms-requests
  httpApi:
    cors: true
    authorizers:
      jwtAuthorizer:
        type: request
        functionArn: ${param:authorizerArn}
        identitySource: $request.header.Authorization
        enableSimpleResponses: true
        payloadVersion: "2.0"
        resultTtlInSeconds: 300

package:
  patterns:
    - "!**"
    - "handlers/**"
    - "migrations/**"
    - "!**/__pycache__/**"

functions:
  # RQ-01
  listCatalog:
    handler: handlers/requests.listCatalog
    events:
      - httpApi: { method: GET, path: /catalog, authorizer: { name: jwtAuthorizer } }
  # RQ-02
  listRequests:
    handler: handlers/requests.listRequests
    events:
      - httpApi: { method: GET, path: /requests, authorizer: { name: jwtAuthorizer } }
  # RQ-03
  createRequest:
    handler: handlers/requests.createRequest
    events:
      - httpApi: { method: POST, path: /requests, authorizer: { name: jwtAuthorizer } }
  # RQ-04
  getRequest:
    handler: handlers/requests.getRequest
    events:
      - httpApi: { method: GET, path: "/requests/{id}", authorizer: { name: jwtAuthorizer } }
  # RQ-05
  updateRequest:
    handler: handlers/requests.updateRequest
    events:
      - httpApi: { method: PATCH, path: "/requests/{id}", authorizer: { name: jwtAuthorizer } }
  # RQ-06
  changeRequestStatus:
    handler: handlers/requests.changeRequestStatus
    events:
      - httpApi: { method: PUT, path: "/requests/{id}/status", authorizer: { name: jwtAuthorizer } }

  migrate:
    handler: handlers/migrate.handle   # se invoca a mano tras el deploy
    timeout: 300

resources:
  Resources:
    # El authorizer vive en el stack infra: API Gateway necesita permiso para invocarlo
    AuthorizerInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: ${param:authorizerArn}
        Principal: apigateway.amazonaws.com
        SourceArn: !Join ["", ["arn:aws:execute-api:", !Ref AWS::Region, ":", !Ref AWS::AccountId, ":", !Ref HttpApi, "/*"]]
